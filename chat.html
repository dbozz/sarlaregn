<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Särlaregn – chatt</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap');
.source-sans-3-header {
  font-family: "Source Sans 3", sans-serif;
  font-optical-sizing: auto;
  font-weight: 500;
  font-style: normal; }
:root{--bg:#eef1ee;--surface:#fbfcfb;--ink:#1c2a2a;--muted:#5d6e6d;--me:#2f5d62;--me-ink:#f3f8f7;--line:#cfd9d6;--accent:#2f5d62;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121a1b;--surface:#1b2627;--ink:#e3ecea;--muted:#92a5a3;--me:#4f8c91;--me-ink:#0d1516;--line:#2b3a3b;--accent:#7fb7bb;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface);font-weight:bold;display:flex;justify-content:space-between;align-items:baseline}
header a{font:13px system-ui,sans-serif;color:var(--muted)}
#log{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:min(660px,94%);padding:10px 14px;border-radius:16px;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px;font:15px system-ui,sans-serif}
.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.sys{font:14.5px/1.5 system-ui,sans-serif;color:var(--muted)}
.cap{font:13px system-ui,sans-serif;color:var(--muted);margin-bottom:6px}
.lyr .pt{margin:0 0 .9em}
.lyr .meta{font:13px system-ui,sans-serif;color:var(--muted)}
.chord{font:700 .72em system-ui,sans-serif;color:var(--accent);vertical-align:super;margin:0 2px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.bar button,.chip{font:14px system-ui,sans-serif;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:3px 11px;cursor:pointer}
.bar button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.hit{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;font:inherit;color:var(--ink);cursor:pointer}
.hit.first{border-top:0}
.hit small{color:var(--muted);font:12.5px system-ui,sans-serif;margin-left:6px}
.hit:hover b,.hit:focus-visible b{color:var(--accent);text-decoration:underline}
code{font:13px ui-monospace,monospace;background:var(--bg);padding:1px 5px;border-radius:4px}
#sug{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 0;background:var(--surface)}
#sug:empty{display:none}
.chip{white-space:nowrap;flex:none}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
#sug:not(:empty)+form{border-top:0}
input{flex:1;min-width:0;font:16px system-ui,sans-serif;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.send{border:0;border-radius:22px;padding:0 18px;background:var(--me);color:var(--me-ink);font:600 15px system-ui,sans-serif;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mc{float:right;display:flex;gap:2px;margin:-4px -6px 0 8px}
.mc button{background:none;border:0;color:var(--muted);cursor:pointer;font:14px system-ui,sans-serif;padding:2px 6px;border-radius:8px}
.me .mc button{color:var(--me-ink)}
.mt{display:none;font:600 15px system-ui,sans-serif}
.col .mt{display:block}.col .mb{display:none}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
#tabs button{flex:none;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:14px system-ui,sans-serif;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:4px 12px;cursor:pointer}
#tabs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#sess{flex:1;overflow-y:auto;padding:16px 14px}
#sess .sh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
#sess .sh b{font-size:19px;margin-right:6px}
#sess button{font:14px system-ui,sans-serif;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:3px 11px;cursor:pointer}
#sess ol{list-style:none;margin:0;padding:0;max-width:660px}
#sess li{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:6px 0}
#sess li .t{flex:1;text-align:left;border:0;background:none;border-radius:0;font:17px Georgia,serif;padding:6px 0}
#sess li small{color:var(--muted);font:13px system-ui,sans-serif;margin-left:8px}
#sess li span{display:flex;gap:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font:14px system-ui,sans-serif;padding:8px 14px;border-radius:18px;z-index:5}
#toast button{margin-left:8px;border:0;background:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){#log{scroll-behavior:auto}}
</style>
</head>
<body>
<header id=source-sans-3-header>Särlaregn <a href="/">Tillbaka till webb</a></header>
<nav id="tabs" aria-label="Sessioner"></nav>
<main id="log" aria-live="polite"></main>
<section id="sess" hidden></section>
<div id="toast" hidden role="status"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<div id="sug"></div>
<form id="f" autocomplete="off">
  <input id="q" type="text" placeholder="Sökord, sångnummer eller /hjälp" aria-label="Meddelande" enterkeyhint="send">
  <button class="send" id="sb" type="submit">Meny</button>
</form>

<!-- Byt gärna till den Dexie-fil som din vanliga sida redan använder, så att versionerna matchar. -->
<script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
<script>
const base_url = "https://script.google.com/macros/s/AKfycbwbFsR030BbU2PHHWmHrEJWxMjXDihCbGXz3tVNZNCeDKXxnDYPobwjEjjcjawPt2ZG/exec";
const BOOK = {"1":"","2":"","5":"ps","3":"hm","6":"js"};

// Samma databas och schema som functions.js
const db = new Dexie("SR");
db.version(6).stores({lyrics:"id, nr, search, ts, sb, browse, bookmarked", bookmarks:"++id, lyrics_id, excerpt"});

const ck = n => { const m = document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)')); return m ? decodeURIComponent(m[1]) : undefined; };
const setCk = (n,v) => document.cookie = n+"="+v+"; expires="+new Date(Date.now()+3.15e12).toUTCString()+"; path=/; SameSite=None; Secure";
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = s => (s||'').replace(/\{[^}]*\}/g,'').trim();
const norm = s => s.toLowerCase().replace(/\s+|-/g,'');
const fixChord = c => c.replace(/^([a-g])([b#]?)(m?)(.*)$/i,(m,n,a,mi,r)=>n.toUpperCase()+a.toLowerCase()+mi.toLowerCase()+r.toUpperCase());

const CH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], ALT={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#',H:'B'};
function transposeChord(ch,st){
  const m = ch.match(/^([A-G][b#]?)(.*)$/); if(!m) return ch;
  let i = CH.indexOf(ALT[m[1]]||m[1]); if(i<0) return ch;
  return CH[(i+st+12)%12]+m[2];
}

const log = document.getElementById('log'), q = document.getElementById('q'), sug = document.getElementById('sug');
let ALL = [];

/* ---------- Data ---------- */
async function fetchDb(){
  if(!navigator.onLine) throw new Error('Du är offline.');
  const key = ck('key1')||'';
  const v = await (await fetch(base_url+"?action=ts&key="+key)).json();
  const data = await (await fetch(base_url+"?action=lyrics&key="+key)).json();
  await db.lyrics.bulkPut(data);
  if(v && v.version) setCk('db_version', v.version);
}
function index(){ ALL.forEach(s=>{ s._t = norm(clean(s.label)); s._tt = clean(s.label).replace(/^\[[^\]]*\]\s*/,''); s._ti = s._tt.toLowerCase(); }); }
async function loadAll(){
  ALL = await db.lyrics.toArray();
  if(!ALL.length){
    add('bot sys','Databasen är tom. Hämtar sånger …');
    await fetchDb(); ALL = await db.lyrics.toArray();
  }
  index();
}
async function updateDb(){
  const v = await (await fetch(base_url+"?action=ts&key="+(ck('key1')||''))).json();
  if(parseInt(v.version,10) > parseInt(ck('db_version')||'0',10)){
    add('bot sys','Ny sångdatabas finns. Hämtar …');
    await db.lyrics.clear(); await fetchDb(); ALL = await db.lyrics.toArray(); index();
    add('bot sys',`Klart. ${ALL.length} sånger.`);
  } else add('bot sys','Du har redan den senaste databasen.');
}

function search(t){
  const n = norm(t); if(!n) return [];
  if(/^\d+$/.test(n)) return ALL.filter(s=>s.nr===n);
  const a=[], b=[];
  for(const s of ALL){ if(s._t.includes(n)) a.push(s); else if(s.search && s.search.includes(n)) b.push(s); }
  return a.concat(b);
}

/* ---------- Utritning ---------- */
function add(cls, html, title){
  const d = document.createElement('div'); d.className = 'msg '+cls;
  const bot = cls.includes('bot');
  d.innerHTML = `<div class="mc">${bot?'<button data-m="col" title="Fäll ihop">▾</button>':''}<button data-m="del" title="Ta bort">✕</button></div><div class="mt"></div><div class="mb">${html}</div>`;
  d.querySelector('.mt').textContent = title || d.querySelector('.mb').textContent.trim().slice(0,50);
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
const tag = s => BOOK[s.sb] ? `<small>${esc(BOOK[s.sb])}</small>` : '';

function hits(list, cap){
  if(!list.length) return add('bot sys','Inga träffar. Prova ett annat ord eller skriv <code>/hjälp</code>.');
  const shown = list.slice(0,15);
  add('bot', `<div class="cap">${cap}${list.length>15?` – visar 15 av ${list.length}`:''}</div>` +
    shown.map((s,i)=>`<button class="hit${i?'':' first'}" data-id="${esc(s.id)}"><b>${esc(clean(s.label))}</b>${tag(s)}</button>`).join(''));
}

function renderBody(el){
  const st = el._s; let c = st.item.value.replace('id="thelyric"','class="lyr"');
  if(st.chords){
    c = c.replace(/\{([^}]*)\}/g,(m,ch)=>{ ch = fixChord(ch); if(st.tr) ch = transposeChord(ch, st.tr); return `<span class="chord">${esc(ch)}</span>`; });
  } else c = c.replace(/\{[^}]*\}/g,'');
  const fs = parseFloat(ck('FontSize')); 
  const key = st.item.key ? transposeChord(fixChord(st.item.key), st.tr) : '';
  const on = st.item.bookmarked==='true';
  el.querySelector('.mb').innerHTML = `<div${fs?` style="font-size:${fs}px"`:''}>${c}</div>
  <div class="bar">
    <button data-a="bm" class="${on?'on':''}" title="Bokmärke">${on?'★':'☆'}</button>
    <button data-a="ch" class="${st.chords?'on':''}" title="Visa ackord">♪ Ackord</button>
    ${st.chords?`<button data-a="up">▲</button><button data-a="rs" title="Nollställ">${esc(key||'–')}</button><button data-a="dn">▼</button>`:''}
    <button data-a="prev">‹ Föregående</button><button data-a="next">Nästa ›</button>
    <button data-a="ses">＋ Session</button><button data-a="cp">Kopiera</button>
  </div>`;
}

function showSong(item, tr=0){
  const el = add('bot','',clean(item.label));
  el._s = {item, tr, chords: ck('showChords')==='1'};
  renderBody(el);
  history.replaceState({}, '', '#'+item.nr+(BOOK[item.sb]?','+BOOK[item.sb]:''));
  document.title = 'Särlaregn nr. '+item.nr;
  log.scrollTop = log.scrollHeight - el.offsetHeight - 24;
}

async function step(item, dir){
  const col = db.lyrics.where('browse');
  const n = await (dir>0 ? col.above(item.browse).first() : col.below(item.browse).reverse().first());
  if(n) showSong(ALL.find(s=>s.id===n.id)||n); else add('bot sys','Det finns ingen sång åt det hållet.');
}

log.addEventListener('click', async e=>{
  const m = e.target.closest('button[data-m]');
  if(m){
    const box = m.closest('.msg');
    if(m.dataset.m==='del') return del(box);
    box.classList.toggle('col'); m.textContent = box.classList.contains('col') ? '▸' : '▾'; return;
  }
  const c = e.target.closest('.cmd');
  if(c){
    if(c.dataset.fill){ q.value = c.dataset.c+' '; syncBtn(); q.focus(); }
    else run(c.dataset.c);
    return;
  }
  const h = e.target.closest('.hit');
  if(h){ const s = ALL.find(x=>x.id===h.dataset.id); if(s){ add('me', esc(clean(s.label))); showSong(s);} return; }
  const b = e.target.closest('button[data-a]'); if(!b) return;
  const el = b.closest('.msg'), st = el._s, a = b.dataset.a;
  if(a==='ch'){ st.chords=!st.chords; setCk('showChords', st.chords?'1':'0'); }
  else if(a==='up') st.tr=(st.tr+1)%12;
  else if(a==='dn') st.tr=(st.tr+11)%12;
  else if(a==='rs') st.tr=0;
  else if(a==='bm'){ const v = st.item.bookmarked==='true'?'false':'true'; await db.lyrics.update(st.item.id,{bookmarked:v}); st.item.bookmarked=v; }
  else if(a==='ses') return addToSession(st.item, st.tr);
  else if(a==='cp'){ navigator.clipboard.writeText(el.querySelector('.lyr').innerText); b.textContent='Kopierad'; return; }
  else if(a==='prev') return step(st.item,-1);
  else if(a==='next') return step(st.item,1);
  renderBody(el);
});

/* ---------- Kommandon ---------- */
function contents(p){
  const pre = p.trim().toLowerCase();
  const list = ALL.filter(s=>s._ti.startsWith(pre)).sort((a,b)=>a._ti.localeCompare(b._ti,'sv'));
  if(!list.length) return add('bot sys',`Inga sånger börjar på ”${esc(p.trim())}”.`);
  let html = `<div class="cap">${pre?`Börjar på ”${esc(p.trim())}”`:'Innehåll'} – ${list.length} sånger</div>`, last = '';
  list.forEach((s,i)=>{
    const L = s._ti.charAt(0).toUpperCase();
    if(!pre && L!==last){ last = L; html += `<div class="cap" style="margin-top:10px"><b>${esc(L)}</b></div>`; }
    html += `<button class="hit${i?'':' first'}" data-id="${esc(s.id)}"><b>${esc(s._tt)}</b><small>nr ${esc(s.nr)}</small>${tag(s)}</button>`;
  });
  add('bot', html, pre ? 'Innehåll: '+p.trim() : 'Innehåll');
}
const CMDS = [
  ['/innehåll','Alla sångtitlar A–Ö (/innehåll A för en bokstav)'],
  ['/nr','Öppna sång med nummer','fill'],
  ['/slumpa','En slumpad sång'],
  ['/bokmärken','Dina bokmärken'],
  ['/uppdatera','Hämta ny sångdatabas'],
  ['/rensa','Töm konversationen'],
  ['/hjälp','Visa hjälptext']
];
function menu(){
  add('bot','<div class="cap">Kommandon</div>' + CMDS.map((c,i)=>
    `<button class="hit cmd${i?'':' first'}" data-c="${c[0]}"${c[2]?' data-fill="1"':''}><b>${c[0]}</b><small>${c[1]}</small></button>`).join(''), 'Meny');
}
function help(){
  add('bot sys',`Skriv ett ord, en titelrad eller ett sångnummer.<br>
<code>/nr 46</code> eller bara <code>46</code> · <code>/slumpa</code> en slumpad sång<br>
<code>/innehåll</code> alla titlar A–Ö · <code>/innehåll A</code> eller <code>/innehåll Ad</code> de som börjar så<br>
Är fältet tomt öppnar knappen <b>Meny</b> en klickbar kommandolista.<br>
<code>/bokmärken</code> dina bokmärken · <code>/uppdatera</code> hämta ny databas<br>
<code>/rensa</code> töm konversationen<br>
Tryck <code>＋ Session</code> på ett sångkort för att samla sånger i en session (flikarna ovan). ▾ fäller ihop ett meddelande och ✕ tar bort det.`);
}
async function run(raw){
  const t = raw.trim(); if(!t) return;
  add('me', esc(t));
  const [c0,...r] = t.split(/\s+/), cmd = c0.toLowerCase(), arg = r.join(' ');
  try{
    if(cmd==='/innehåll'||cmd==='/innehall') return contents(arg);
    if(['/hjälp','/hjalp','/help'].includes(cmd)) return help();
    if(cmd==='/rensa'){ log.innerHTML=''; return help(); }
    if(cmd==='/slumpa') return showSong(ALL[Math.floor(Math.random()*ALL.length)]);
    if(cmd==='/bokmärken'||cmd==='/bokmarken'){ return hits(ALL.filter(s=>s.bookmarked==='true'),'Bokmärken'); }
    if(cmd==='/uppdatera') return await updateDb();
    if(cmd==='/nr') return handle(arg);
    if(cmd.startsWith('/')) return add('bot sys',`Okänt kommando <code>${esc(cmd)}</code>. Skriv <code>/hjälp</code>.`);
    handle(t);
  }catch(err){ add('bot sys','Något gick fel: '+esc(err.message||err)); }
}
function handle(t){
  const found = search(t);
  if(/^\d+$/.test(norm(t)) && found.length===1) return showSong(found[0]);
  hits(found, `${found.length} träffar på ”${esc(t)}”`);
}

const SB = document.getElementById('sb');
const syncBtn = () => { SB.textContent = q.value.trim() ? 'Skicka' : 'Meny'; };
document.getElementById('f').addEventListener('submit', e=>{
  e.preventDefault(); const v = q.value;
  if(!v.trim()) return menu();
  q.value = ''; sug.innerHTML = ''; syncBtn(); run(v); q.focus();
});
q.addEventListener('input', ()=>{
  syncBtn();
  const v = q.value; if(v.length<2 || v.startsWith('/')){ sug.innerHTML=''; return; }
  sug.innerHTML = search(v).slice(0,6).map(s=>`<button type="button" class="chip" data-id="${esc(s.id)}">${esc(clean(s.label))}</button>`).join('');
});
sug.addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  const s = ALL.find(x=>x.id===c.dataset.id); sug.innerHTML=''; q.value=''; syncBtn(); add('me',esc(clean(s.label))); showSong(s); q.focus();
});

/* ---------- Slänga meddelanden ---------- */
const TO = document.getElementById('toast'); let tt;
function toast(t, undo){
  clearTimeout(tt); TO.innerHTML = esc(t) + (undo ? ' <button>Ångra</button>' : ''); TO.hidden = false;
  if(undo) TO.querySelector('button').onclick = ()=>{ undo(); TO.hidden = true; };
  tt = setTimeout(()=>TO.hidden = true, 5000);
}
function del(el){
  const next = el.nextSibling; el.remove();
  toast('Meddelandet togs bort', ()=>log.insertBefore(el, next && next.parentNode===log ? next : null));
}

/* ---------- Sessioner (egen databas, rör inte SR) ---------- */
const sdb = new Dexie("SR_sessions"); sdb.version(1).stores({sessions:"id, created"});
const P = document.getElementById('sess'), TB = document.getElementById('tabs'), F = document.getElementById('f');
let SESS = [], cur = 'chat', act = null;
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const save = s => { s.version = (s.version||0)+1; return sdb.sessions.put(s); };
const keyOf = (it,tr) => it && it.key ? transposeChord(fixChord(it.key), tr||0) : '';

async function loadSess(){
  SESS = (await sdb.sessions.toArray()).sort((a,b)=>a.created-b.created);
  act = lsGet('sr_act'); if(!SESS.find(s=>s.id===act)) act = SESS[0] ? SESS[0].id : null;
  tabs();
}
function tabs(){
  TB.innerHTML = `<button data-t="chat" class="${cur==='chat'?'on':''}">Sök</button>` +
    SESS.map(s=>`<button data-t="${s.id}" class="${cur===s.id?'on':''}" title="${esc(s.namn)}">${esc(s.namn)}</button>`).join('') +
    '<button data-t="new" title="Ny session">＋</button>';
}
function view(v){
  cur = v; const chat = v==='chat';
  log.hidden = sug.hidden = F.hidden = !chat; P.hidden = chat;
  if(!chat){ act = v; lsSet('sr_act', v); renderSess(); }
  tabs();
}
async function newSession(namn, songs=[], go=true){
  const s = {id:Date.now().toString(36), namn, version:0, created:Date.now(), songs};
  await save(s); SESS.push(s); if(go) view(s.id); else tabs(); return s;
}
async function addToSession(item, tr){
  let s = SESS.find(x=>x.id===act);
  if(!s){ s = await newSession('Session 1', [], false); act = s.id; lsSet('sr_act', act); }
  const i = s.songs.findIndex(x=>x.id===item.id);
  if(i>=0) s.songs[i].tr = tr; else s.songs.push({id:item.id, tr});
  await save(s);
  toast(i>=0 ? `Tonart uppdaterad i ”${s.namn}”` : `Lagd i ”${s.namn}”`);
}
function listText(s){
  return s.songs.map((x,k)=>{ const it = ALL.find(a=>a.id===x.id), key = keyOf(it,x.tr);
    return `${k+1}. ${it?clean(it.label):'(saknas)'}${key?' – '+key:''}`; }).join('\n');
}
function renderSess(){
  const s = SESS.find(x=>x.id===cur); if(!s) return;
  const rows = s.songs.map((x,i)=>{ const it = ALL.find(a=>a.id===x.id), key = keyOf(it,x.tr);
    return `<li data-i="${i}"><button class="t" data-s="open">${it?esc(clean(it.label)):'(saknas i databasen)'}${key?`<small>${esc(key)}</small>`:''}</button>
      <span><button data-s="up" title="Flytta upp">↑</button><button data-s="dn" title="Flytta ned">↓</button><button data-s="rm" title="Ta bort ur sessionen">✕</button></span></li>`; }).join('');
  P.innerHTML = `<div class="sh"><b>${esc(s.namn)}</b>
    <button data-s="ren">Byt namn</button><button data-s="cp">Kopiera lista</button><button data-s="ex">Exportera</button><button data-s="imp">Importera</button><button data-s="del">Ta bort</button></div>` +
    (s.songs.length ? `<ol>${rows}</ol>` : `<p class="sys">Sessionen är tom. Sök en sång under Sök och tryck ＋ Session på sångkortet.</p>`);
}
TB.addEventListener('click', async e=>{
  const b = e.target.closest('button[data-t]'); if(!b) return;
  if(b.dataset.t==='new'){ const n = prompt('Namn på sessionen','Gudstjänst'); if(n && n.trim()) await newSession(n.trim()); }
  else view(b.dataset.t);
});
P.addEventListener('click', async e=>{
  const b = e.target.closest('button[data-s]'); if(!b) return;
  const s = SESS.find(x=>x.id===cur); if(!s) return;
  const a = b.dataset.s, li = b.closest('li'), i = li ? +li.dataset.i : -1;
  if(a==='open'){
    const it = ALL.find(x=>x.id===s.songs[i].id); if(!it) return toast('Sången finns inte i databasen.');
    view('chat'); add('me', esc(clean(it.label))); return showSong(it, s.songs[i].tr);
  }
  if(a==='up' && i>0) [s.songs[i-1], s.songs[i]] = [s.songs[i], s.songs[i-1]];
  else if(a==='dn' && i>=0 && i<s.songs.length-1) [s.songs[i+1], s.songs[i]] = [s.songs[i], s.songs[i+1]];
  else if(a==='rm') s.songs.splice(i,1);
  else if(a==='ren'){ const n = prompt('Nytt namn', s.namn); if(!n || !n.trim()) return; s.namn = n.trim(); }
  else if(a==='cp'){ navigator.clipboard.writeText(listText(s)); return toast('Listan kopierad'); }
  else if(a==='imp') return document.getElementById('imp').click();
  else if(a==='ex'){
    const blob = new Blob([JSON.stringify({namn:s.namn, songs:s.songs}, null, 1)], {type:'application/json'});
    const l = document.createElement('a'); l.href = URL.createObjectURL(blob);
    l.download = s.namn.replace(/[^\wåäöÅÄÖ-]+/g,'-') + '.json';
    document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(l.href), 1000); return;
  }
  else if(a==='del'){
    if(!confirm(`Ta bort ”${s.namn}”?`)) return;
    await sdb.sessions.delete(s.id); SESS = SESS.filter(x=>x!==s);
    if(act===s.id){ act = SESS[0] ? SESS[0].id : null; lsSet('sr_act', act||''); }
    return view('chat');
  }
  await save(s); tabs(); renderSess();
});
document.getElementById('imp').addEventListener('change', async e=>{
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const d = JSON.parse(await f.text()); if(!Array.isArray(d.songs)) throw 0;
    await newSession((d.namn||'Importerad')+' (import)', d.songs.filter(x=>x && x.id).map(x=>({id:String(x.id), tr:((+x.tr||0)%12+12)%12})));
  }catch(err){ toast('Filen gick inte att läsa som en session.'); }
});

/* ---------- Start ---------- */
(async ()=>{
  await loadSess().catch(()=>tabs());
  try{ await loadAll(); }
  catch(err){ add('bot sys','Kunde inte läsa databasen: '+esc(err.message||err)+'<br>Öppna först vanliga sidan och ange din nyckel under Inställningar.'); return; }
  add('bot sys',`Hej! ${ALL.length} sånger redo.`); help();
  const h = decodeURIComponent(location.hash.slice(1)); if(h){ const [n,bk]=h.split(','); 
    const f = search(n).filter(s=>!bk || BOOK[s.sb]===bk || (!BOOK[s.sb] && !bk)); if(f[0]){ add('me',esc(n)); showSong(f[0]); } }
})();
</script>
